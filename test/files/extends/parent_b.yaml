%YAML 1.1
---
release_platforms:
  ubuntu:
    - precise
repositories:
  repo_b:
    release:
      packages:
        - pkg_b
      tags:
        release: release/{package}/{version}
      url: https://github.com/example-release/repo_b-release.git
      version: 0.1.0
  collision_repo:
    release:
      packages:
        - collision_pkg
      tags:
        release: release/{package}/{version}
      url: https://github.com/example-release/collision-release.git
      version: 0.2.0
type: distribution
version: 3
